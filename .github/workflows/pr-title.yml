name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  validate:
    name: Validate PR title
    runs-on: ubuntu-24.04
    steps:
      - name: Check Conventional Commit title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s\n' "$TITLE" | grep -Eq '^(feat|fix|perf|refactor|docs|test|ci|chore|build)(\([a-z0-9._/-]+\))?: .+'; then
            echo "PR title must match 'type(scope): description' (Conventional Commit)." >&2
            exit 1
          fi
          if [ "${#TITLE}" -gt 72 ]; then
            echo "PR title must be 72 characters or fewer." >&2
            exit 1
          fi
