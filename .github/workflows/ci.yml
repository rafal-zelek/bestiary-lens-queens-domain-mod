name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CI_IMAGE: bestiary-lens-ci

jobs:
  check-and-package:
    name: Lint, test and package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build pinned toolchain
        run: docker build --tag "$CI_IMAGE" .

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          docker run --rm --network none --env RELEASE_TAG --entrypoint python3 "$CI_IMAGE" -c '
          import os, sys
          from package import VERSION
          expected, actual = "v" + VERSION, os.environ["RELEASE_TAG"]
          print(f"Package version expects {expected}; pushed tag is {actual}")
          sys.exit(0 if actual == expected else 1)
          '

      - name: Check Lua formatting
        run: docker run --rm --network none "$CI_IMAGE" format-check

      - name: Verify active SDK integrity
        run: docker run --rm --network none "$CI_IMAGE" types-verify

      - name: Lint GitHub workflows
        run: docker run --rm --network none "$CI_IMAGE" workflow-lint

      - name: Run LuaLS diagnostics
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace" \
            "$CI_IMAGE" lint

      - name: Run Python and Lua tests
        run: docker run --rm --network none "$CI_IMAGE" test

      - name: Build mod and SDK packages
        run: |
          for task in package types-package; do
            docker run --rm --network none --user "$(id -u):$(id -g)" \
              --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace" \
              "$CI_IMAGE" "$task"
          done

      - name: Upload mod package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mod-${{ github.sha }}
          path: |
            build/BestiaryLens-*.zip
            build/BestiaryLens-*.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
          overwrite: true

      - name: Upload SDK package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-${{ github.sha }}
          path: |
            build/types/QueensDomain-types-*.zip
            build/types/QueensDomain-types-*.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
          overwrite: true

      - name: Upload LuaLS logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: luals-${{ github.sha }}
          path: build/luals/*.log
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true
