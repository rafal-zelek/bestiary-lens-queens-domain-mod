name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CI_IMAGE: bestiary-lens-ci

jobs:
  check-and-package:
    name: Lint, test and package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build pinned toolchain
        run: docker build --tag "$CI_IMAGE" .

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          docker run --rm --network none --env RELEASE_TAG --entrypoint python3 "$CI_IMAGE" -c '
          import os, sys
          from tools.package import VERSION
          expected, actual = "v" + VERSION, os.environ["RELEASE_TAG"]
          print(f"Package version expects {expected}; pushed tag is {actual}")
          sys.exit(0 if actual == expected else 1)
          '

      - name: Check Lua formatting
        run: docker run --rm --network none "$CI_IMAGE" format-check

      - name: Verify active SDK integrity
        run: docker run --rm --network none "$CI_IMAGE" types-verify

      - name: Lint GitHub workflows
        run: docker run --rm --network none "$CI_IMAGE" workflow-lint

      - name: Run LuaLS diagnostics
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace" \
            "$CI_IMAGE" lint

      - name: Run Python and Lua tests
        run: docker run --rm --network none "$CI_IMAGE" test

      - name: Test release notes generation
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace" \
            --entrypoint bash "$CI_IMAGE" tools/test-git-cliff.sh

      - name: Build mod and SDK packages
        run: |
          for task in package types-package; do
            docker run --rm --network none --user "$(id -u):$(id -g)" \
              --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace" \
              "$CI_IMAGE" "$task"
          done

      - name: Generate release notes
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace" \
            --entrypoint bash "$CI_IMAGE" tools/release-notes.sh "$RELEASE_TAG"

      - name: Select package artifacts
        id: package-artifacts
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          from tools.package import VERSION

          safe_version = re.compile(r'[A-Za-z0-9][A-Za-z0-9._-]{0,79}')
          if not isinstance(VERSION, str) or not safe_version.fullmatch(VERSION):
              raise SystemExit('Mod package version is invalid')

          types_dir = Path('types')
          pointer_path = types_dir / 'active.json'
          if types_dir.is_symlink() or pointer_path.is_symlink() or not pointer_path.is_file():
              raise SystemExit('Active SDK pointer is missing or unsafe')
          pointer = json.loads(pointer_path.read_text(encoding='utf-8'))
          version = pointer.get('version')
          if pointer.get('schema') != 2 or not isinstance(version, str) or not safe_version.fullmatch(version):
              raise SystemExit('Active SDK pointer has an invalid schema or version')

          build = Path('build')
          artifact_dir = build / 'types'
          if build.is_symlink() or artifact_dir.is_symlink() or not artifact_dir.is_dir():
              raise SystemExit('SDK artifact directory is missing or unsafe')
          mod_package = build / f'BestiaryLens-{VERSION}.zip'
          mod_checksum = build / f'BestiaryLens-{VERSION}.zip.sha256'
          package = artifact_dir / f'QueensDomain-types-{version}.zip'
          checksum = artifact_dir / f'QueensDomain-types-{version}.zip.sha256'
          if any(path.is_symlink() or not path.is_file() for path in (mod_package, mod_checksum)):
              raise SystemExit(f'Mod package or checksum is missing or unsafe: {VERSION}')
          if any(path.is_symlink() or not path.is_file() for path in (package, checksum)):
              raise SystemExit(f'Active SDK package or checksum is missing or unsafe: {version}')

          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as output:
              output.write(f'mod_version={VERSION}\n')
              output.write(f'sdk_version={version}\n')
          PY

      - name: Upload mod package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mod-${{ github.sha }}
          path: |
            build/BestiaryLens-${{ steps.package-artifacts.outputs.mod_version }}.zip
            build/BestiaryLens-${{ steps.package-artifacts.outputs.mod_version }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
          overwrite: true

      - name: Upload SDK package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-${{ github.sha }}
          path: |
            build/types/QueensDomain-types-${{ steps.package-artifacts.outputs.sdk_version }}.zip
            build/types/QueensDomain-types-${{ steps.package-artifacts.outputs.sdk_version }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
          overwrite: true

      - name: Upload release notes
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes-${{ github.sha }}
          path: build/release-notes.md
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload LuaLS logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: luals-${{ github.sha }}
          path: build/luals/*.log
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true

  publish-github-release:
    name: Publish GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: check-and-package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      nexus_ready: ${{ steps.publisher-readiness.outputs.ready }}
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Determine optional publisher readiness
        id: publisher-readiness
        env:
          NEXUS_API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
          NEXUS_FILE_ID: ${{ vars.NEXUSMODS_FILE_ID }}
          NEXUS_MOD_ID: ${{ vars.NEXUSMODS_MOD_ID }}
        run: |
          if [[ -n "$NEXUS_API_KEY" && -n "$NEXUS_FILE_ID" && -n "$NEXUS_MOD_ID" ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            echo 'Optional publisher credentials are complete.'
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Optional publisher credentials are incomplete; its job will be skipped.'
          fi

      - name: Download mod package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: mod-${{ github.sha }}
          path: release-assets

      - name: Download release notes
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-notes-${{ github.sha }}
          path: release-notes

      - name: Verify release asset set and checksum
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          packages=(release-assets/BestiaryLens-*.zip)
          checksums=(release-assets/BestiaryLens-*.zip.sha256)
          test "${#packages[@]}" -eq 1
          test "${#checksums[@]}" -eq 1
          test -s release-notes/release-notes.md
          (cd release-assets && sha256sum --check "$(basename "${checksums[0]}")")
          test "$(basename "${packages[0]}")" = "BestiaryLens-${RELEASE_TAG#v}.zip"

      - name: Create GitHub release if absent
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub release $RELEASE_TAG already exists; keeping its body and assets unchanged."
          else
            gh release create "$RELEASE_TAG" \
              release-assets/BestiaryLens-*.zip \
              release-assets/BestiaryLens-*.zip.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "Bestiary Lens $RELEASE_TAG" \
              --notes-file release-notes/release-notes.md
          fi

      - name: Verify GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash tools/verify-github-release.sh "$RELEASE_TAG"

  publish-nexus:
    name: Publish Nexus Mods update
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.publish-github-release.outputs.nexus_ready == 'true'
    needs: publish-github-release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download mod package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: mod-${{ github.sha }}
          path: release-assets

      - name: Download release notes
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-notes-${{ github.sha }}
          path: release-notes

      - name: Prepare Nexus version and changelog
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          [[ "$version" =~ ^[A-Za-z0-9.-]{1,50}$ ]]
          python3 - "$version" <<'PY'
          import os
          import sys
          from pathlib import Path
          version = sys.argv[1]
          notes = Path('release-notes/release-notes.md').read_text()
          if not notes.strip():
              raise SystemExit('Release notes are empty; refusing Nexus publication.')
          if len(notes) > 65535:
              raise SystemExit('Release notes exceed the Nexus changelog limit of 65535 characters.')
          delimiter = 'NEXUS_CHANGELOG_' + os.urandom(16).hex()
          while delimiter in notes:
              delimiter = 'NEXUS_CHANGELOG_' + os.urandom(16).hex()
          with open(os.environ['GITHUB_ENV'], 'a') as env_file:
              env_file.write(f'NEXUS_VERSION={version}\n')
              env_file.write(f'NEXUS_FILENAME=BestiaryLens-{version}.zip\n')
              env_file.write(f'NEXUS_CHANGELOG<<{delimiter}\n{notes}\n{delimiter}\n')
          PY

      - name: Check Nexus attempt marker
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash tools/nexus-release-marker.sh check "$RELEASE_TAG"

      - name: Record Nexus attempt marker
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash tools/nexus-release-marker.sh write "$RELEASE_TAG"

      - name: Upload new Nexus file version and changelog
        uses: Nexus-Mods/upload-action@98532f7670c27cbecc78fae03fa3e278147827e2 # v1.0.0-beta.11
        env:
          NEXUS_API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
          NEXUS_FILE_ID: ${{ vars.NEXUSMODS_FILE_ID }}
          NEXUS_MOD_ID: ${{ vars.NEXUSMODS_MOD_ID }}
        with:
          api_key: ${{ env.NEXUS_API_KEY }}
          file_id: ${{ env.NEXUS_FILE_ID }}
          filename: release-assets/${{ env.NEXUS_FILENAME }}
          version: ${{ env.NEXUS_VERSION }}
          update_mod_version: true
          mod_id: ${{ env.NEXUS_MOD_ID }}
          changelog: ${{ env.NEXUS_CHANGELOG }}

      - name: Update Nexus page description
        env:
          NEXUS_API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
          NEXUS_MOD_ID: ${{ vars.NEXUSMODS_MOD_ID }}
        run: python3 tools/nexus-page-description.py
