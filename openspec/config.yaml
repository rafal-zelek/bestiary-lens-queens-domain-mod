schema: spec-driven
skillsScope: project

context: |
  Existing codebase. Inspect affected code and tests first. Preserve existing
  behavior unless explicitly changing it. OpenSpec owns requirements, design, and
  task planning. Use engineering skills for implementation and quality. Prefer
  concise, actionable documentation over verbosity.

rules:
  proposal:
    - Keep proposals under 300 words
    - State intended behavior, rationale, and non-goals
  design:
    - Document meaningful architectural decisions only
  specs:
    - Describe observable behavior and important scenarios
  tasks:
    - Keep tasks small, concrete, and independently verifiable

operations:
  apply:
    guidance:
      - Follow approved artifacts
      - Select skills automatically
      - Delegate independent tasks
      - Use TDD and systematic debugging
      - Run verification before completion
  archive:
    guidance:
      - Confirm implementation and verification are complete
      - Summarize remaining limitations
